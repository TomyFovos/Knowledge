name: Import SDD PDF

on:
  push:
    paths:
      - '.github/workflows/import-sdd-pdf.yml'

permissions:
  contents: write

jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source deck as PDF
        shell: bash
        run: |
          set -euo pipefail
          deck_url='https://speakerdeck.com/watany/expiration-date-of-sdd'
          presentation_id='5be9d727010b4964a9fa5a9159277329'
          output='09_References/Spec-Driven Development/仕様駆動開発の消費期限.pdf'
          mkdir -p "$(dirname "$output")"

          curl -fsSL "$deck_url" -o /tmp/deck.html
          pdf_url=$(python3 - <<'PY'
          import html, re
          s = html.unescape(open('/tmp/deck.html', encoding='utf-8').read())
          urls = re.findall(r'https://files\.speakerdeck\.com/presentations/[^"\'<> ]+\.pdf', s)
          print(urls[0] if urls else '')
          PY
          )

          if [ -n "$pdf_url" ]; then
            echo "Downloading Speaker Deck PDF: $pdf_url"
            curl -fL "$pdf_url" -o "$output"
          else
            echo 'Direct PDF URL was not exposed; rebuilding the PDF from the published slide images.'
            python3 -m pip install --quiet pillow
            mkdir -p /tmp/sdd-slides
            for i in $(seq 0 50); do
              curl -fL "https://files.speakerdeck.com/presentations/${presentation_id}/slide_${i}.jpg" -o "/tmp/sdd-slides/slide_${i}.jpg"
            done
            python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('/tmp/sdd-slides').glob('slide_*.jpg'), key=lambda p: int(p.stem.split('_')[1]))
          images = [Image.open(p).convert('RGB') for p in files]
          out = Path('09_References/Spec-Driven Development/仕様駆動開発の消費期限.pdf')
          images[0].save(out, save_all=True, append_images=images[1:], resolution=96.0)
          PY
          fi

          test -s "$output"
          file "$output"

      - name: Commit PDF and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-sdd-pdf.yml
          git add '09_References/Spec-Driven Development/仕様駆動開発の消費期限.pdf'
          git commit -m 'docs: add source PDF for spec-driven development note'
          git push
