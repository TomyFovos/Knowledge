name: Reconstruct AI governance PDF

on:
  push:
    paths:
      - '.upload_chunks/ai_governance/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '09_References/AI駆動開発'
          cat .upload_chunks/ai_governance/*.b64 | base64 --decode > '09_References/AI駆動開発/AI駆動開発が変える、大規模開発の前提.pdf'
          echo 'ac61c7c97b39c760320f25796671a7236f823be4d9c3cd0714808077dd02bf18  09_References/AI駆動開発/AI駆動開発が変える、大規模開発の前提.pdf' | sha256sum --check
      - name: Commit PDF and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '09_References/AI駆動開発/AI駆動開発が変える、大規模開発の前提.pdf'
          git rm -r .upload_chunks/ai_governance
          git rm .github/workflows/reconstruct-ai-governance-pdf.yml
          git commit -m 'docs: add AI governance source PDF'
          git push
