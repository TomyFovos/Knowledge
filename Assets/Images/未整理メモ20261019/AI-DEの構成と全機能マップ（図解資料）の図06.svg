<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950"><style>
:root{
  --bg:#08101e;--panel:#101a2d;--panel2:#14223a;--stroke:#314565;
  --text:#edf4ff;--muted:#a9b8cf;
  --blue:#67a3ff;--green:#65d99c;--orange:#f3b35e;
  --purple:#b78cff;--red:#ff7d8e;--cyan:#66d7e5;--yellow:#f2d96d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;padding-bottom:24px}
header{width:min(80vw,1700px);margin:0 auto;padding:24px 28px 14px;border-bottom:1px solid #22324f;background:linear-gradient(180deg,#111a2d,#08101e);border-radius:0 0 18px 18px}
h1{font-size:28px;margin:0}
.sub{margin-top:8px;color:var(--muted);line-height:1.7}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;width:min(80vw,1700px);margin:0 auto;padding:12px 18px;background:rgba(8,16,30,.96);border-bottom:1px solid #22324f}
.tab{padding:9px 13px;border:1px solid #334766;border-radius:10px;background:#111b2f;color:#dce8ff;font-weight:700;cursor:pointer}
.tab.active{background:#24508d;border-color:#74aaff}
.view{display:none;width:min(80vw,1700px);margin:0 auto;padding:20px}.view.active{display:block}
.card{background:var(--panel);border:1px solid #263955;border-radius:18px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.scroll{overflow:auto}
svg{width:100%;height:auto;min-width:980px}
.title{fill:#f2f7ff;font-size:20px;font-weight:800}
.txt{fill:#f2f7ff;font-size:17px;font-weight:800}
.small{fill:#cfdaec;font-size:13.5px;font-weight:600}
.tiny{fill:#a9b8cf;font-size:11.5px}
.tag{fill:#c8d8f2;font-size:12px;font-weight:700}
.box{fill:#121d31;stroke:#536a8f;stroke-width:2}
.blue{fill:#13294d;stroke:#67a3ff;stroke-width:2.2}
.green{fill:#122e25;stroke:#65d99c;stroke-width:2.2}
.orange{fill:#332412;stroke:#f3b35e;stroke-width:2.2}
.purple{fill:#281c3d;stroke:#b78cff;stroke-width:2.2}
.red{fill:#351925;stroke:#ff7d8e;stroke-width:2.2}
.cyan{fill:#11303a;stroke:#66d7e5;stroke-width:2.2}
.yellow{fill:#332f14;stroke:#f2d96d;stroke-width:2.2}
.dashed{stroke-dasharray:8 6}
.line{stroke:#8ea9d9;stroke-width:2.2;fill:none}
.note{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);border-radius:9px;background:#10192c;color:#d9e4f7;line-height:1.75}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%}
footer{width:min(80vw,1700px);margin:0 auto;padding:18px 24px 32px;color:var(--muted);font-size:12.5px}
#svg-tip{
  position:fixed;z-index:1000;display:none;max-width:360px;
  padding:10px 12px;border:1px solid #516a94;border-radius:10px;
  background:rgba(8,16,30,.97);color:#eef5ff;font-size:13px;line-height:1.55;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.32);white-space:pre-line
}
.hint-bar{width:min(80vw,1700px);margin:14px auto 0;padding:10px 14px;border:1px dashed #5577aa;border-radius:12px;background:#0d1728;color:#d7e6ff;font-size:13px;line-height:1.7}
.hint-key{display:inline-block;margin-right:12px;padding:2px 8px;border:1px solid #5f7fb3;border-radius:999px;color:#eef6ff;background:#14243f;font-size:12px;font-weight:700}
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.explain-card{background:var(--panel2);border:1px solid #2f4567;border-radius:14px;padding:12px 14px}
.explain-card h3{margin:0 0 8px;font-size:14px;color:#f0f6ff}
.explain-card p{margin:0;color:#cfdcf1;font-size:13px;line-height:1.75}
.explain-title{margin:16px 2px 8px;color:#eef5ff;font-size:15px;font-weight:800}
svg .hoverable-node{cursor:help;stroke-dasharray:8 5}
svg text.hoverable-label{cursor:help}
svg line.help-underline{stroke:#dfeaff;stroke-width:1.5;stroke-dasharray:2 3;opacity:.9}

svg rect.blue,svg rect.green,svg rect.orange,svg rect.purple,svg rect.red,
svg rect.cyan,svg rect.yellow,svg rect.box{cursor:help}
.status-pill{font-size:12px;color:var(--muted)}

</style>
<defs>
  <symbol id="repo6" viewBox="0 0 32 32"><path d="M4 9h9l3 3h12v14H4z" fill="none" stroke="#fff" stroke-width="2"/><path d="M9 17h14M9 21h10" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="monitor6" viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="17" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 27h8M16 22v5" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="test6" viewBox="0 0 32 32"><path d="M11 4h10M13 4v7l-7 13a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-7-13V4" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="docs6" viewBox="0 0 32 32"><path d="M8 5h12l5 5v17H8zM20 5v6h6M12 16h10M12 20h10" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="shield6" viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="router6" viewBox="0 0 32 32"><path d="M5 9h16M16 5l5 4-5 4M27 23H11M16 19l-5 4 5 4" stroke="#fff" stroke-width="2" fill="none"/></symbol>
</defs>
<text x="40" y="52" class="title">Repository / 責務の所在</text>

<rect x="55" y="95" width="410" height="705" rx="18" class="blue"/>
<circle cx="108" cy="142" r="27" fill="#1d4175"/><use href="#repo6" x="92" y="126" width="32" height="32"/>
<text x="148" y="147" class="txt">TomyFovos/AI-DE</text>
<text x="95" y="195" class="small">• Core / Application Service</text>
<text x="95" y="228" class="small">• Protocol v1 / Protocol Host</text>
<text x="95" y="261" class="small">• State Store / SQLite / PostgreSQL</text>
<text x="95" y="294" class="small">• Project Identity / Host Lock / Migration</text>
<text x="95" y="327" class="small">• Task / Attempt / Operation / Operation Log</text>
<text x="95" y="360" class="small">• Execution Runtime（AI実行基盤） / trusted launcher</text>
<text x="95" y="393" class="small">• Capability / Policy / Runtime Invariant</text>
<text x="95" y="426" class="small">• Requirements / QA Ledger / Gate</text>
<text x="95" y="459" class="small">• Human Decision / Governance / Exception</text>
<text x="95" y="492" class="small">• Artifact Revision / Evidence / Object Store</text>
<text x="95" y="525" class="small">• Provider Adapter / AI_MODELS.yaml</text>
<text x="95" y="558" class="small">• Platform Test / 生成物テスト</text>
<text x="95" y="618" class="tiny">実行状態のAuthorityはAI-DEに集約</text>

<rect x="545" y="95" width="395" height="485" rx="18" class="green"/>
<circle cx="598" cy="142" r="27" fill="#214b3b"/><use href="#monitor6" x="582" y="126" width="32" height="32"/>
<text x="638" y="147" class="txt">TomyFovos/Orca</text>
<text x="585" y="195" class="small">• AI-DE Protocol Client</text>
<text x="585" y="228" class="small">• Project / Phase / Task Projection</text>
<text x="585" y="261" class="small">• Operation / Evidence表示</text>
<text x="585" y="294" class="small">• Human Decision / Gate UI</text>
<text x="585" y="327" class="small">• Capability Profile設定UI</text>
<text x="585" y="360" class="small">• SSH / Terminal / Worktree</text>
<text x="585" y="393" class="small">• Editor / Diff / Notification</text>
<text x="585" y="447" class="tiny">Orcaは実行状態の正本を持たない</text>

<rect x="1030" y="95" width="405" height="300" rx="18" class="cyan"/>
<circle cx="1083" cy="142" r="27" fill="#1f5761"/><use href="#test6" x="1067" y="126" width="32" height="32"/>
<text x="1123" y="147" class="txt">Software-Test-Knowledge</text>
<text x="1070" y="195" class="small">• 汎用Software Test Knowledge</text>
<text x="1070" y="228" class="small">• Candidate / Relation / Status</text>
<text x="1070" y="261" class="small">• Release / Versioning</text>
<text x="1070" y="315" class="tiny">Project固有の適用判断AuthorityはAI-DE側</text>

<rect x="545" y="640" width="395" height="190" rx="18" class="cyan dashed"/>
<circle cx="598" cy="688" r="27" fill="#1f5761"/><use href="#docs6" x="582" y="672" width="32" height="32"/>
<text x="638" y="693" class="txt">Document Asset（将来候補Repo）</text>
<text x="585" y="738" class="small">• 過去ドキュメント活用</text>
<text x="585" y="771" class="small">• Storage / Codec / Search内部実装</text>

<rect x="1030" y="475" width="405" height="225" rx="18" class="purple dashed"/>
<circle cx="1083" cy="523" r="27" fill="#4b2d70"/><use href="#shield6" x="1067" y="507" width="32" height="32"/>
<text x="1123" y="528" class="txt">Security Proxy（将来候補Repo）</text>
<text x="1070" y="573" class="small">• LLM通信Security Boundary</text>
<text x="1070" y="606" class="small">• Project masking ON/OFF</text>
<text x="1070" y="639" class="small">• 中央Service配備も可能</text>

<rect x="1030" y="755" width="405" height="110" rx="18" class="orange"/>
<circle cx="1083" cy="810" r="27" fill="#6b461c"/><use href="#router6" x="1067" y="794" width="32" height="32"/>
<text x="1123" y="815" class="txt">OpenCodex</text>
<text x="1070" y="846" class="small">外部のModel / Provider接続Componentとして利用</text>

<rect x="55" y="850" width="885" height="58" rx="14" class="box"/>
<text x="498" y="886" text-anchor="middle" class="small">日本ハーネス自体は現時点で巨大な単一Repositoryにしない</text>
</svg>