<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860"><style>
:root{
  --bg:#08101e;--panel:#101a2d;--panel2:#14223a;--stroke:#314565;
  --text:#edf4ff;--muted:#a9b8cf;
  --blue:#67a3ff;--green:#65d99c;--orange:#f3b35e;
  --purple:#b78cff;--red:#ff7d8e;--cyan:#66d7e5;--yellow:#f2d96d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;padding-bottom:24px}
header{width:min(80vw,1700px);margin:0 auto;padding:24px 28px 14px;border-bottom:1px solid #22324f;background:linear-gradient(180deg,#111a2d,#08101e);border-radius:0 0 18px 18px}
h1{font-size:28px;margin:0}
.sub{margin-top:8px;color:var(--muted);line-height:1.7}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;width:min(80vw,1700px);margin:0 auto;padding:12px 18px;background:rgba(8,16,30,.96);border-bottom:1px solid #22324f}
.tab{padding:9px 13px;border:1px solid #334766;border-radius:10px;background:#111b2f;color:#dce8ff;font-weight:700;cursor:pointer}
.tab.active{background:#24508d;border-color:#74aaff}
.view{display:none;width:min(80vw,1700px);margin:0 auto;padding:20px}.view.active{display:block}
.card{background:var(--panel);border:1px solid #263955;border-radius:18px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.scroll{overflow:auto}
svg{width:100%;height:auto;min-width:980px}
.title{fill:#f2f7ff;font-size:20px;font-weight:800}
.txt{fill:#f2f7ff;font-size:17px;font-weight:800}
.small{fill:#cfdaec;font-size:13.5px;font-weight:600}
.tiny{fill:#a9b8cf;font-size:11.5px}
.tag{fill:#c8d8f2;font-size:12px;font-weight:700}
.box{fill:#121d31;stroke:#536a8f;stroke-width:2}
.blue{fill:#13294d;stroke:#67a3ff;stroke-width:2.2}
.green{fill:#122e25;stroke:#65d99c;stroke-width:2.2}
.orange{fill:#332412;stroke:#f3b35e;stroke-width:2.2}
.purple{fill:#281c3d;stroke:#b78cff;stroke-width:2.2}
.red{fill:#351925;stroke:#ff7d8e;stroke-width:2.2}
.cyan{fill:#11303a;stroke:#66d7e5;stroke-width:2.2}
.yellow{fill:#332f14;stroke:#f2d96d;stroke-width:2.2}
.dashed{stroke-dasharray:8 6}
.line{stroke:#8ea9d9;stroke-width:2.2;fill:none}
.note{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);border-radius:9px;background:#10192c;color:#d9e4f7;line-height:1.75}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%}
footer{width:min(80vw,1700px);margin:0 auto;padding:18px 24px 32px;color:var(--muted);font-size:12.5px}
#svg-tip{
  position:fixed;z-index:1000;display:none;max-width:360px;
  padding:10px 12px;border:1px solid #516a94;border-radius:10px;
  background:rgba(8,16,30,.97);color:#eef5ff;font-size:13px;line-height:1.55;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.32);white-space:pre-line
}
.hint-bar{width:min(80vw,1700px);margin:14px auto 0;padding:10px 14px;border:1px dashed #5577aa;border-radius:12px;background:#0d1728;color:#d7e6ff;font-size:13px;line-height:1.7}
.hint-key{display:inline-block;margin-right:12px;padding:2px 8px;border:1px solid #5f7fb3;border-radius:999px;color:#eef6ff;background:#14243f;font-size:12px;font-weight:700}
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.explain-card{background:var(--panel2);border:1px solid #2f4567;border-radius:14px;padding:12px 14px}
.explain-card h3{margin:0 0 8px;font-size:14px;color:#f0f6ff}
.explain-card p{margin:0;color:#cfdcf1;font-size:13px;line-height:1.75}
.explain-title{margin:16px 2px 8px;color:#eef5ff;font-size:15px;font-weight:800}
svg .hoverable-node{cursor:help;stroke-dasharray:8 5}
svg text.hoverable-label{cursor:help}
svg line.help-underline{stroke:#dfeaff;stroke-width:1.5;stroke-dasharray:2 3;opacity:.9}

svg rect.blue,svg rect.green,svg rect.orange,svg rect.purple,svg rect.red,
svg rect.cyan,svg rect.yellow,svg rect.box{cursor:help}
.status-pill{font-size:12px;color:var(--muted)}

</style>
<defs>
  <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ea9d9"/></marker>
  <symbol id="user" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M6 28c1-7 5-10 10-10s9 3 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="monitor" viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="17" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 27h8M16 22v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="workflow" viewBox="0 0 32 32"><circle cx="7" cy="8" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="25" cy="8" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="24" r="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 8h12M9 10l5 11M23 10l-5 11" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="shield" viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 16l3 3 7-8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="router" viewBox="0 0 32 32"><path d="M5 9h16M16 5l5 4-5 4M27 23H11M16 19l-5 4 5 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="cloud" viewBox="0 0 32 32"><path d="M9 25h14a6 6 0 0 0 1-12 9 9 0 0 0-17-2A7 7 0 0 0 9 25z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="test" viewBox="0 0 32 32"><path d="M11 4h10M13 4v7l-7 13a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-7-13V4" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 20h10M12 24l2 2 5-5" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="docs" viewBox="0 0 32 32"><path d="M8 5h12l5 5v17H8z" fill="none" stroke="#fff" stroke-width="2"/><path d="M20 5v6h6M12 16h10M12 20h10" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="ticket" viewBox="0 0 32 32"><path d="M5 10a3 3 0 0 0 0 6v6h22v-6a3 3 0 0 0 0-6V4H5z" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 7v12" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/></symbol>
  <symbol id="git" viewBox="0 0 32 32"><circle cx="8" cy="7" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="8" cy="25" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="24" cy="16" r="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 10v12M8 14c7 0 9 2 13 2" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="microscope" viewBox="0 0 32 32"><path d="M12 5l6 6-4 4-6-6zM14 15c-2 5 1 9 6 9h5M7 28h20M20 7l3-3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
</defs>

<rect x="20" y="20" width="1460" height="790" rx="26" fill="none" stroke="#40577f" stroke-width="3"/>
<text x="45" y="58" class="title">日本ハーネス = AI開発を成立させるシステム群の上位アーキテクチャ</text>

<!-- Human -->
<rect x="55" y="105" width="220" height="185" rx="18" class="green"/>
<circle cx="105" cy="150" r="27" fill="#214b3b"/><use href="#user" x="89" y="134" width="32" height="32"/>
<text x="145" y="153" class="txt">Human</text>
<text x="95" y="198" class="small">目的 / 判断 / 承認</text>
<text x="95" y="226" class="small">Governance / Exception</text>
<text x="95" y="254" class="tiny">最終責任</text>

<!-- Orca -->
<rect x="335" y="85" width="270" height="225" rx="18" class="blue"/>
<circle cx="385" cy="132" r="27" fill="#1d4175"/><use href="#monitor" x="369" y="116" width="32" height="32"/>
<text x="425" y="136" class="txt">Orca</text>
<text x="375" y="180" class="small">AI開発管理コンソール</text>
<text x="375" y="208" class="small">状態表示 + 意図・Command送信</text>
<text x="375" y="236" class="small">SSH / Terminal / Worktree</text>
<text x="375" y="264" class="small">Diff / Decision / Gate UI</text>
<text x="375" y="289" class="tiny">任意。OrcaなしでもAI-DEは成立</text>

<!-- AI-DE -->
<rect x="665" y="78" width="405" height="265" rx="18" class="blue"/>
<circle cx="720" cy="128" r="30" fill="#1d4175"/><use href="#workflow" x="702" y="110" width="36" height="36"/>
<text x="770" y="134" class="txt">AI-DE</text>
<text x="705" y="180" class="small">開発ハーネス本体 / 実行と状態のAuthority</text>
<text x="705" y="212" class="small">Requirements → Design → Implementation</text>
<text x="705" y="240" class="small">→ Test → Review</text>
<text x="705" y="278" class="small">State / Gate / Task / Attempt / Operation</text>
<text x="705" y="306" class="small">Artifact / Evidence / Human Decision</text>
<text x="705" y="330" class="tiny">State Store = Runtime State SSOT</text>

<path d="M275 190H335" class="line" marker-end="url(#a1)"/>
<path d="M605 190H665" class="line" marker-end="url(#a1)"/>
<path d="M275 250C430 360 560 350 665 260" class="line dashed" marker-end="url(#a1)"/>
<text x="425" y="355" class="tag">CLI / APIでAI-DEへ直接</text>

<!-- Security Proxy -->
<rect x="1120" y="92" width="320" height="128" rx="18" class="purple"/>
<circle cx="1168" cy="137" r="27" fill="#4b2d70"/><use href="#shield" x="1152" y="121" width="32" height="32"/>
<text x="1208" y="142" class="txt">Security Proxy</text>
<text x="1160" y="180" class="small">LLM外部送信のセキュリティ境界</text>
<text x="1160" y="204" class="tiny">Mask ON/OFF。OFFでも通過</text>

<!-- OpenCodex -->
<rect x="1120" y="248" width="320" height="112" rx="18" class="orange"/>
<circle cx="1168" cy="292" r="27" fill="#6b461c"/><use href="#router" x="1152" y="276" width="32" height="32"/>
<text x="1208" y="297" class="txt">OpenCodex</text>
<text x="1160" y="333" class="small">Provider / Model の接続・振り分け</text>

<!-- LLM Provider群 -->
<rect x="1120" y="400" width="320" height="160" rx="18" class="red"/>
<circle cx="1168" cy="445" r="27" fill="#6d2936"/><use href="#cloud" x="1152" y="429" width="32" height="32"/>
<text x="1208" y="450" class="txt">LLM Provider群</text>
<text x="1160" y="488" class="small">Claude / OpenAI / Codex</text>
<text x="1160" y="516" class="small">Qwen / Other Cloud</text>
<text x="1160" y="544" class="small">Local LLM</text>

<path d="M1070 160H1120" class="line" marker-end="url(#a1)"/>
<path d="M1280 220V248" class="line" marker-end="url(#a1)"/>
<path d="M1280 360V400" class="line" marker-end="url(#a1)"/>

<!-- STK -->
<rect x="70" y="455" width="300" height="160" rx="18" class="cyan"/>
<circle cx="120" cy="500" r="27" fill="#1f5761"/><use href="#test" x="104" y="484" width="32" height="32"/>
<text x="160" y="505" class="txt">Software-Test-Knowledge</text>
<text x="110" y="545" class="small">汎用ソフトウェアテスト知識</text>
<text x="110" y="573" class="tiny">「何をテストするか」の候補を提供</text>
<text x="110" y="596" class="tiny">適用判断Authorityではない</text>

<!-- Document Asset -->
<rect x="405" y="455" width="300" height="160" rx="18" class="cyan"/>
<circle cx="455" cy="500" r="27" fill="#1f5761"/><use href="#docs" x="439" y="484" width="32" height="32"/>
<text x="495" y="505" class="txt">Document Asset</text>
<text x="445" y="545" class="small">過去ドキュメント活用基盤</text>
<text x="445" y="573" class="tiny">Playbook / Template / Exemplar</text>
<text x="445" y="596" class="tiny">Import / Read / Write-back</text>

<!-- Tracker -->
<rect x="740" y="455" width="275" height="160" rx="18" class="yellow"/>
<circle cx="790" cy="500" r="27" fill="#60561c"/><use href="#ticket" x="774" y="484" width="32" height="32"/>
<text x="830" y="505" class="txt">Task Tracker</text>
<text x="780" y="545" class="small">GitHub Issues / Backlog</text>
