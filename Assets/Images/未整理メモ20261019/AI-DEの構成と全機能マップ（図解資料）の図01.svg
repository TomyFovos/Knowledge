<!-- Repo -->
<rect x="70" y="660" width="945" height="118" rx="18" class="green"/>
<circle cx="125" cy="716" r="29" fill="#214b3b"/><use href="#git" x="108" y="699" width="34" height="34"/>
<text x="170" y="710" class="txt">Repository / Worktree / 成果物出力先</text>
<text x="110" y="747" class="small">複数Git Repository / Worktree / Excel / Word / SharePoint / その他</text>
<text x="110" y="772" class="tiny">Repository物理配置はAI-DEが強制しない</text>

<!-- Verification -->
<rect x="1070" y="645" width="370" height="138" rx="18" class="box"/>
<circle cx="1120" cy="694" r="27" fill="#273650"/><use href="#microscope" x="1104" y="678" width="32" height="32"/>
<text x="1160" y="699" class="txt">検証レイヤー</text>
<text x="1110" y="737" class="small">Platform Test / 生成物テスト</text>
<text x="1110" y="763" class="tiny">Runtime不変条件 / 障害注入 / Evidence</text>
</svg>