<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900"><style>
:root{
  --bg:#08101e;--panel:#101a2d;--panel2:#14223a;--stroke:#314565;
  --text:#edf4ff;--muted:#a9b8cf;
  --blue:#67a3ff;--green:#65d99c;--orange:#f3b35e;
  --purple:#b78cff;--red:#ff7d8e;--cyan:#66d7e5;--yellow:#f2d96d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;padding-bottom:24px}
header{width:min(80vw,1700px);margin:0 auto;padding:24px 28px 14px;border-bottom:1px solid #22324f;background:linear-gradient(180deg,#111a2d,#08101e);border-radius:0 0 18px 18px}
h1{font-size:28px;margin:0}
.sub{margin-top:8px;color:var(--muted);line-height:1.7}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;width:min(80vw,1700px);margin:0 auto;padding:12px 18px;background:rgba(8,16,30,.96);border-bottom:1px solid #22324f}
.tab{padding:9px 13px;border:1px solid #334766;border-radius:10px;background:#111b2f;color:#dce8ff;font-weight:700;cursor:pointer}
.tab.active{background:#24508d;border-color:#74aaff}
.view{display:none;width:min(80vw,1700px);margin:0 auto;padding:20px}.view.active{display:block}
.card{background:var(--panel);border:1px solid #263955;border-radius:18px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.scroll{overflow:auto}
svg{width:100%;height:auto;min-width:980px}
.title{fill:#f2f7ff;font-size:20px;font-weight:800}
.txt{fill:#f2f7ff;font-size:17px;font-weight:800}
.small{fill:#cfdaec;font-size:13.5px;font-weight:600}
.tiny{fill:#a9b8cf;font-size:11.5px}
.tag{fill:#c8d8f2;font-size:12px;font-weight:700}
.box{fill:#121d31;stroke:#536a8f;stroke-width:2}
.blue{fill:#13294d;stroke:#67a3ff;stroke-width:2.2}
.green{fill:#122e25;stroke:#65d99c;stroke-width:2.2}
.orange{fill:#332412;stroke:#f3b35e;stroke-width:2.2}
.purple{fill:#281c3d;stroke:#b78cff;stroke-width:2.2}
.red{fill:#351925;stroke:#ff7d8e;stroke-width:2.2}
.cyan{fill:#11303a;stroke:#66d7e5;stroke-width:2.2}
.yellow{fill:#332f14;stroke:#f2d96d;stroke-width:2.2}
.dashed{stroke-dasharray:8 6}
.line{stroke:#8ea9d9;stroke-width:2.2;fill:none}
.note{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);border-radius:9px;background:#10192c;color:#d9e4f7;line-height:1.75}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%}
footer{width:min(80vw,1700px);margin:0 auto;padding:18px 24px 32px;color:var(--muted);font-size:12.5px}
#svg-tip{
  position:fixed;z-index:1000;display:none;max-width:360px;
  padding:10px 12px;border:1px solid #516a94;border-radius:10px;
  background:rgba(8,16,30,.97);color:#eef5ff;font-size:13px;line-height:1.55;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.32);white-space:pre-line
}
.hint-bar{width:min(80vw,1700px);margin:14px auto 0;padding:10px 14px;border:1px dashed #5577aa;border-radius:12px;background:#0d1728;color:#d7e6ff;font-size:13px;line-height:1.7}
.hint-key{display:inline-block;margin-right:12px;padding:2px 8px;border:1px solid #5f7fb3;border-radius:999px;color:#eef6ff;background:#14243f;font-size:12px;font-weight:700}
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.explain-card{background:var(--panel2);border:1px solid #2f4567;border-radius:14px;padding:12px 14px}
.explain-card h3{margin:0 0 8px;font-size:14px;color:#f0f6ff}
.explain-card p{margin:0;color:#cfdcf1;font-size:13px;line-height:1.75}
.explain-title{margin:16px 2px 8px;color:#eef5ff;font-size:15px;font-weight:800}
svg .hoverable-node{cursor:help;stroke-dasharray:8 5}
svg text.hoverable-label{cursor:help}
svg line.help-underline{stroke:#dfeaff;stroke-width:1.5;stroke-dasharray:2 3;opacity:.9}

svg rect.blue,svg rect.green,svg rect.orange,svg rect.purple,svg rect.red,
svg rect.cyan,svg rect.yellow,svg rect.box{cursor:help}
.status-pill{font-size:12px;color:var(--muted)}

</style>
<defs>
  <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ea9d9"/></marker>
  <symbol id="runtime5" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M13 11l8 5-8 5z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="lock5" viewBox="0 0 32 32"><rect x="7" y="14" width="18" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 14v-4a5 5 0 0 1 10 0v4" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="boundary5" viewBox="0 0 32 32"><path d="M5 5v22M27 5v22M11 16h10M18 12l4 4-4 4" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="bug5" viewBox="0 0 32 32"><path d="M11 10h10v12a5 5 0 0 1-10 0zM14 5l2 5M18 5l-2 5M6 14h5M21 14h5M6 20h5M21 20h5" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="evidence5" viewBox="0 0 32 32"><path d="M7 5h13l5 5v17H7zM20 5v6h6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="14" cy="18" r="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M17 21l4 4" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="micro5" viewBox="0 0 32 32"><path d="M12 5l6 6-4 4-6-6zM14 15c-2 5 1 9 6 9h5M7 28h20M20 7l3-3" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="file5" viewBox="0 0 32 32"><path d="M8 5h12l5 5v17H8zM20 5v6h6" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 20l3 3 7-8" stroke="#fff" stroke-width="2" fill="none"/></symbol>
</defs>
<text x="40" y="52" class="title">Platform Test / 検証アーキテクチャ</text>

<rect x="520" y="85" width="460" height="180" rx="18" class="blue"/>
<circle cx="575" cy="132" r="27" fill="#1d4175"/><use href="#runtime5" x="559" y="116" width="32" height="32"/>
<text x="615" y="137" class="txt">AI-DE Runtime</text>
<text x="560" y="180" class="small">State Store / Execution Runtime（AI実行基盤） / Protocol</text>
<text x="560" y="210" class="small">Gate / Artifact / Evidence</text>
<text x="560" y="238" class="tiny">正常系だけでなく異常時Stateも検証</text>

<rect x="70" y="360" width="305" height="220" rx="18" class="green"/>
<circle cx="120" cy="405" r="27" fill="#214b3b"/><use href="#lock5" x="104" y="389" width="32" height="32"/>
<text x="160" y="410" class="txt">Runtime不変条件</text>
<text x="105" y="455" class="small">Gate前Phase遷移禁止</text>
<text x="105" y="487" class="small">Capability超過禁止</text>
<text x="105" y="519" class="small">Evidenceなし完了禁止</text>

<rect x="420" y="360" width="305" height="220" rx="18" class="purple"/>
<circle cx="470" cy="405" r="27" fill="#4b2d70"/><use href="#boundary5" x="454" y="389" width="32" height="32"/>
<text x="510" y="410" class="txt">決定的実行境界</text>
<text x="455" y="455" class="small">Intent保存前後</text>
<text x="455" y="487" class="small">Effect前後</text>
<text x="455" y="519" class="small">Result保存前後</text>

<rect x="770" y="360" width="305" height="220" rx="18" class="red"/>
<circle cx="820" cy="405" r="27" fill="#6d2936"/><use href="#bug5" x="804" y="389" width="32" height="32"/>
<text x="860" y="410" class="txt">障害注入</text>
<text x="805" y="455" class="small">crash / timeout</text>
<text x="805" y="487" class="small">provider / tool error</text>
<text x="805" y="519" class="small">state_store_error</text>

<rect x="1120" y="360" width="305" height="220" rx="18" class="orange"/>
<circle cx="1170" cy="405" r="27" fill="#6b461c"/><use href="#evidence5" x="1154" y="389" width="32" height="32"/>
<text x="1210" y="410" class="txt">Evidence検証</text>
<text x="1155" y="455" class="small">Artifact Revision</text>
<text x="1155" y="487" class="small">Evidence completeness</text>
<text x="1155" y="519" class="small">Gate evaluation history</text>

<path d="M650 265C500 320 360 320 230 360M720 265C650 315 610 325 570 360M780 265C850 315 900 325 920 360M850 265C1000 315 1160 320 1270 360" class="line" marker-end="url(#a5)"/>

<rect x="160" y="660" width="525" height="150" rx="18" class="cyan"/>
<circle cx="215" cy="710" r="27" fill="#1f5761"/><use href="#micro5" x="199" y="694" width="32" height="32"/>
<text x="255" y="715" class="txt">Platform Test</text>
<text x="200" y="755" class="small">AI-DEという開発基盤そのものを検証</text>
<text x="200" y="784" class="tiny">Feature Registry / Component Inventory / Evidence / 障害注入</text>

<rect x="815" y="660" width="525" height="150" rx="18" class="yellow"/>
<circle cx="870" cy="710" r="27" fill="#60561c"/><use href="#file5" x="854" y="694" width="32" height="32"/>
<text x="910" y="715" class="txt">生成物テスト</text>
<text x="855" y="755" class="small">AI-DEが生成・同期する成果物を検証</text>
<text x="855" y="784" class="tiny">Determinism / stale / orphan / tamper / provenance</text>
</svg>