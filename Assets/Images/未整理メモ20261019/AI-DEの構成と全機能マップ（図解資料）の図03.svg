<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 770"><style>
:root{
  --bg:#08101e;--panel:#101a2d;--panel2:#14223a;--stroke:#314565;
  --text:#edf4ff;--muted:#a9b8cf;
  --blue:#67a3ff;--green:#65d99c;--orange:#f3b35e;
  --purple:#b78cff;--red:#ff7d8e;--cyan:#66d7e5;--yellow:#f2d96d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;padding-bottom:24px}
header{width:min(80vw,1700px);margin:0 auto;padding:24px 28px 14px;border-bottom:1px solid #22324f;background:linear-gradient(180deg,#111a2d,#08101e);border-radius:0 0 18px 18px}
h1{font-size:28px;margin:0}
.sub{margin-top:8px;color:var(--muted);line-height:1.7}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;width:min(80vw,1700px);margin:0 auto;padding:12px 18px;background:rgba(8,16,30,.96);border-bottom:1px solid #22324f}
.tab{padding:9px 13px;border:1px solid #334766;border-radius:10px;background:#111b2f;color:#dce8ff;font-weight:700;cursor:pointer}
.tab.active{background:#24508d;border-color:#74aaff}
.view{display:none;width:min(80vw,1700px);margin:0 auto;padding:20px}.view.active{display:block}
.card{background:var(--panel);border:1px solid #263955;border-radius:18px;padding:12px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.scroll{overflow:auto}
svg{width:100%;height:auto;min-width:980px}
.title{fill:#f2f7ff;font-size:20px;font-weight:800}
.txt{fill:#f2f7ff;font-size:17px;font-weight:800}
.small{fill:#cfdaec;font-size:13.5px;font-weight:600}
.tiny{fill:#a9b8cf;font-size:11.5px}
.tag{fill:#c8d8f2;font-size:12px;font-weight:700}
.box{fill:#121d31;stroke:#536a8f;stroke-width:2}
.blue{fill:#13294d;stroke:#67a3ff;stroke-width:2.2}
.green{fill:#122e25;stroke:#65d99c;stroke-width:2.2}
.orange{fill:#332412;stroke:#f3b35e;stroke-width:2.2}
.purple{fill:#281c3d;stroke:#b78cff;stroke-width:2.2}
.red{fill:#351925;stroke:#ff7d8e;stroke-width:2.2}
.cyan{fill:#11303a;stroke:#66d7e5;stroke-width:2.2}
.yellow{fill:#332f14;stroke:#f2d96d;stroke-width:2.2}
.dashed{stroke-dasharray:8 6}
.line{stroke:#8ea9d9;stroke-width:2.2;fill:none}
.note{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);border-radius:9px;background:#10192c;color:#d9e4f7;line-height:1.75}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%}
footer{width:min(80vw,1700px);margin:0 auto;padding:18px 24px 32px;color:var(--muted);font-size:12.5px}
#svg-tip{
  position:fixed;z-index:1000;display:none;max-width:360px;
  padding:10px 12px;border:1px solid #516a94;border-radius:10px;
  background:rgba(8,16,30,.97);color:#eef5ff;font-size:13px;line-height:1.55;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.32);white-space:pre-line
}
.hint-bar{width:min(80vw,1700px);margin:14px auto 0;padding:10px 14px;border:1px dashed #5577aa;border-radius:12px;background:#0d1728;color:#d7e6ff;font-size:13px;line-height:1.7}
.hint-key{display:inline-block;margin-right:12px;padding:2px 8px;border:1px solid #5f7fb3;border-radius:999px;color:#eef6ff;background:#14243f;font-size:12px;font-weight:700}
.explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.explain-card{background:var(--panel2);border:1px solid #2f4567;border-radius:14px;padding:12px 14px}
.explain-card h3{margin:0 0 8px;font-size:14px;color:#f0f6ff}
.explain-card p{margin:0;color:#cfdcf1;font-size:13px;line-height:1.75}
.explain-title{margin:16px 2px 8px;color:#eef5ff;font-size:15px;font-weight:800}
svg .hoverable-node{cursor:help;stroke-dasharray:8 5}
svg text.hoverable-label{cursor:help}
svg line.help-underline{stroke:#dfeaff;stroke-width:1.5;stroke-dasharray:2 3;opacity:.9}

svg rect.blue,svg rect.green,svg rect.orange,svg rect.purple,svg rect.red,
svg rect.cyan,svg rect.yellow,svg rect.box{cursor:help}
.status-pill{font-size:12px;color:var(--muted)}

</style>
<defs>
  <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ea9d9"/></marker>
  <symbol id="wf3" viewBox="0 0 32 32"><circle cx="7" cy="8" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="25" cy="8" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="24" r="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 8h12M9 10l5 11M23 10l-5 11" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="play3" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="2"/><path d="M13 11l8 5-8 5z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="shield3" viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
  <symbol id="router3" viewBox="0 0 32 32"><path d="M5 9h16M16 5l5 4-5 4M27 23H11M16 19l-5 4 5 4" stroke="#fff" stroke-width="2" fill="none"/></symbol>
  <symbol id="cloud3" viewBox="0 0 32 32"><path d="M9 25h14a6 6 0 0 0 1-12 9 9 0 0 0-17-2A7 7 0 0 0 9 25z" fill="none" stroke="#fff" stroke-width="2"/></symbol>
</defs>
<text x="40" y="52" class="title">AI実行・LLM経路</text>

<g>
<rect x="55" y="110" width="250" height="155" rx="18" class="blue"/>
<circle cx="105" cy="156" r="27" fill="#1d4175"/><use href="#wf3" x="89" y="140" width="32" height="32"/>
<text x="145" y="161" class="txt">AI-DE Core</text>
<text x="95" y="202" class="small">Task / Capability / Model方針</text>
<text x="95" y="232" class="tiny">意思決定Authority</text>
</g>

<g>
<rect x="365" y="110" width="270" height="155" rx="18" class="orange"/>
<circle cx="415" cy="156" r="27" fill="#6b461c"/><use href="#play3" x="399" y="140" width="32" height="32"/>
<text x="455" y="161" class="txt">Execution Runtime（AI実行基盤）</text>
<text x="405" y="202" class="small">Execution Packet / Worker</text>
<text x="405" y="232" class="tiny">Operation / Tool Guard</text>
</g>

<g>
<rect x="695" y="110" width="250" height="155" rx="18" class="purple"/>
<circle cx="745" cy="156" r="27" fill="#4b2d70"/><use href="#shield3" x="729" y="140" width="32" height="32"/>
<text x="785" y="161" class="txt">Security Proxy</text>
<text x="735" y="202" class="small">Mask ON / OFF</text>
<text x="735" y="232" class="tiny">OFFでも必ず通過</text>
</g>

<g>
<rect x="1005" y="110" width="220" height="155" rx="18" class="orange"/>
<circle cx="1055" cy="156" r="27" fill="#6b461c"/><use href="#router3" x="1039" y="140" width="32" height="32"/>
<text x="1095" y="161" class="txt">OpenCodex</text>
<text x="1045" y="202" class="small">Provider / Model の接続・振り分け</text>
<text x="1045" y="232" class="tiny">Authorityではない</text>
</g>

<g>
<rect x="1280" y="75" width="170" height="225" rx="18" class="red"/>
<circle cx="1365" cy="120" r="27" fill="#6d2936"/><use href="#cloud3" x="1349" y="104" width="32" height="32"/>
<text x="1365" y="165" text-anchor="middle" class="txt">LLM Provider群</text>
<text x="1365" y="198" text-anchor="middle" class="small">Claude</text>
<text x="1365" y="226" text-anchor="middle" class="small">OpenAI / Codex</text>
<text x="1365" y="254" text-anchor="middle" class="small">Qwen / Local</text>
</g>

<path d="M305 188H365M635 188H695M945 188H1005M1225 188H1280" class="line" marker-end="url(#a3)"/>

<rect x="55" y="370" width="530" height="280" rx="18" class="green"/>
<text x="95" y="415" class="txt">AI-DE側の責務</text>
<text x="95" y="458" class="small">✓ Role / Task難易度 / Capabilityを決定</text>
<text x="95" y="492" class="small">✓ Provider固有値をCore Planへ漏らさない</text>
<text x="95" y="526" class="small">✓ Intent / Effect / Result / Evidenceを記録</text>
<text x="95" y="560" class="small">✓ retry / fallback / stopをAI-DEが判断</text>
<text x="95" y="594" class="small">✓ State Store書込不能なら新規Effect停止</text>

<rect x="635" y="370" width="365" height="280" rx="18" class="purple"/>
<text x="675" y="415" class="txt">Security Proxy</text>
<text x="675" y="458" class="small">✓ Project単位Masking</text>
<text x="675" y="492" class="small">✓ 機密情報保護</text>
<text x="675" y="526" class="small">✓ ON/OFFに関係なく経路固定</text>
<text x="675" y="560" class="small">✓ Local LLMも同一境界</text>
<text x="675" y="598" class="tiny">DB Secret管理は担当しない</text>

<rect x="1050" y="370" width="400" height="280" rx="18" class="orange"/>
<text x="1090" y="415" class="txt">OpenCodex</text>
<text x="1090" y="458" class="small">✓ Provider / Modelへの接続</text>
<text x="1090" y="492" class="small">✓ 複数Provider差異の吸収</text>
<text x="1090" y="526" class="small">✓ Routing component</text>
<text x="1090" y="560" class="small">× Gate / Task Authorityは持たない</text>

<rect x="55" y="685" width="1395" height="55" rx="12" class="box"/>
<text x="752" y="719" text-anchor="middle" class="small">Human → Orca（任意）→ AI-DE → Security Proxy → OpenCodex → LLM Provider</text>
</svg>